name: Release

# Release workflow: A tag vX.Y.Z triggers Build → Tests →
# self-contained publish (win-x64) → release package (zip + sha256) →
# GitHub release. The release is only created when Build AND Tests
# succeed (a failing step aborts the job).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-test-publish:
    name: Build, Test & Publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (with RID for self-contained publish)
        # The RID is required during restore: otherwise project.assets.json
        # lacks the net8.0-windows/win-x64 target and publish fails with NETSDK1047.
        run: dotnet restore FrameBouncer.sln -r win-x64

      - name: Build (Release)
        run: dotnet build FrameBouncer.sln -c Release --no-restore

      - name: Test (all tests must pass)
        run: dotnet test FrameBouncer.sln -c Release --no-build

      - name: Publish App (single-file, self-contained, win-x64)
        # Portable single EXE: elevation (--elevated-helper) and update (--updater)
        # run in THE SAME file – no separate helper/updater EXEs anymore.
        run: dotnet publish FrameBouncer/FrameBouncer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true --no-restore -o publish/app

      - name: Determine version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Create release package (zip + sha256)
        shell: pwsh
        run: |
          $zip = "FrameBouncer-v${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/app/FrameBouncer.exe -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "FrameBouncer-v${{ steps.version.outputs.version }}-win-x64.zip" `
            "FrameBouncer-v${{ steps.version.outputs.version }}-win-x64.zip.sha256" `
            --title "FrameBouncer ${{ github.ref_name }}" `
            --notes "Automatically built release package (self-contained win-x64).`n`nSHA-256 is verified via the .sha256 file (no digital signature)."